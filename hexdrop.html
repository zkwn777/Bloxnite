    if (G.stage === 0 && G.t > 80) { G.stage = 1; banner('TOP LAYER CRUMBLES!', 1.6); sfx('rumble'); layers[0].list.forEach(function (t) { dropTile(t, rr(0.2, 7)); }); }
    if (G.stage === 1 && G.t > 115) { G.stage = 2; banner('LAYER 2 CRUMBLES!', 1.6); sfx('rumble'); layers[1].list.forEach(function (t) { dropTile(t, rr(0.2, 7)); }); }
    if (G.stage === 2 && G.t > 150) { G.stage = 3; banner('LAYER 3 CRUMBLES!', 1.6); sfx('rumble'); layers[2].list.forEach(function (t) { dropTile(t, rr(0.2, 7)); }); }
    if (G.stage === 3 && G.t > 180) { G.stage = 4; banner('LAST LAYER SHRINKS!', 1.6); sfx('rumble'); }
    if (G.stage === 4) { G.shrink += dt; var rad = Math.max(0, RADS[3] + 1 - G.shrink / 3); layers[3].list.forEach(function (t) { var dd = Math.max(Math.abs(t.q), Math.abs(t.r), Math.abs(-t.q - t.r)); if (dd > rad) dropTile(t, rr(0.1, 0.9)); }); }
  }
  beans.forEach(function (b) { animBean(b, dt); });
  /* result */
  if (G.endAt && G.t >= G.endAt && G.playing) endMatch();
  /* camera */
  var tgt = P;
  if (!P.alive) { var al = beans.filter(function (b) { return b.alive; }); if (al.length) tgt = al[G.specIdx % al.length]; }
  var cx = tgt.x + Math.sin(G.camYaw) * Math.cos(G.camPitch) * G.camDist, cz = tgt.z + Math.cos(G.camYaw) * Math.cos(G.camPitch) * G.camDist, cyy = Math.max(tgt.y, P.alive ? P.y : tgt.y) + 1.4 + Math.sin(G.camPitch) * G.camDist;
  var tyy = P.alive ? P.y : tgt.y; cyy = tyy + 1.4 + Math.sin(G.camPitch) * G.camDist;
  var k = 1 - Math.exp(-dt * 9); camPos[0] = lerp(camPos[0], cx, k); camPos[1] = lerp(camPos[1], cyy, 1 - Math.exp(-dt * 5)); camPos[2] = lerp(camPos[2], cz, k);
  camera.position.set(camPos[0], camPos[1], camPos[2]); camera.lookAt(tgt.x, tyy + 1.0, tgt.z);
  sun.position.set(tgt.x + 20, tyy + 50, tgt.z + 15); sun.target.position.set(tgt.x, tyy, tgt.z); sun.target.updateMatrixWorld();
  /* HUD */
  $('aliveN').textContent = aliveCount(); var tm = Math.floor(G.t), ts = G.phase === 'count' ? '0:00' : Math.floor(tm / 60) + ':' + (tm % 60 < 10 ? '0' : '') + (tm % 60); $('timer').textContent = ts;
  /* "you" tag */
  var you = $('you'); if (P.alive) { var v = new THREE.Vector3(P.x, P.y + 2.0, P.z); v.project(camera); var onS = v.z < 1; you.style.display = onS ? 'block' : 'none'; you.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + 'px'; you.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + 'px'; } else you.style.display = 'none';
}
function endMatch() {
  G.playing = false; var r = G.result || { win: false, place: aliveCount() };
  if (!save.best || r.place < save.best) save.best = r.place; persist();
  $('hud').classList.remove('on'); document.body.classList.remove('play');
  $('endT').textContent = r.win ? 'You win!' : (r.place <= 3 ? 'So close!' : 'Eliminated'); $('endP').textContent = 'Place #' + r.place + ' of 16' + (r.win ? '  👑' : '');
  showScr('scrEnd'); refreshMenu();
}

/* ---------- UI ---------- */
function showScr(id) { ['scrMenu', 'scrEnd', 'scrPause'].forEach(function (s) { $(s).classList.toggle('on', s === id); }); }
function refreshMenu() {
  $('stW').textContent = save.crowns; $('stB').textContent = save.best ? '#' + save.best : '-'; $('stP').textContent = save.played;
  Array.prototype.forEach.call($('diffSeg').children, function (b) { b.classList.toggle('on', +b.dataset.d === save.diff); });
  Array.prototype.forEach.call($('swatches').children, function (s, i) { s.classList.toggle('on', i === save.color); });
}
BCOL.forEach(function (c, i) { var s = document.createElement('div'); s.className = 'sw'; s.style.background = '#' + ('000000' + c.toString(16)).slice(-6); s.onclick = function () { save.color = i; sfx('ui'); persist(); refreshMenu(); }; $('swatches').appendChild(s); });
$('diffSeg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; save.diff = +b.dataset.d; sfx('ui'); persist(); refreshMenu(); });
$('nameIn').value = save.name; $('nameIn').addEventListener('input', function () { save.name = $('nameIn').value.slice(0, 10) || 'Bean'; persist(); });
$('bPlay').onclick = function () { initAudio(); startMatch(); }; $('bAgain').onclick = function () { initAudio(); startMatch(); };
$('bMenu').onclick = function () { showScr('scrMenu'); }; $('bLeave').onclick = function () { G.playing = false; G.paused = false; $('hud').classList.remove('on'); document.body.classList.remove('play'); showScr('scrMenu'); };
function pause() { if (!G.playing || G.paused) { if (G.paused) resume(); return; } G.paused = true; $('sens').value = save.sens; $('vol').value = save.vol; showScr('scrPause'); }
function resume() { G.paused = false; showScr(null); }
$('bResume').onclick = resume; $('sens').oninput = function () { save.sens = +$('sens').value; persist(); }; $('vol').oninput = function () { save.vol = +$('vol').value; if (master) master.gain.value = save.vol; persist(); };
$('bPause').addEventListener('pointerdown', function (e) { e.stopPropagation(); pause(); });
refreshMenu();

/* idle menu camera + loop */
buildArena(); P = { x: 0, y: 0, z: 0, alive: true };
var last = performance.now();
function frame(t) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (G.playing && !G.paused) update(dt);
  else if (!G.playing) { var a = t * 0.0002; camera.position.set(Math.cos(a) * 46, 22, Math.sin(a) * 46); camera.lookAt(0, -3, 0); for (var i = 0; i < decor.length; i++) { var d = decor[i]; d.m.position.y = d.y + Math.sin(t * 0.001 * d.sp + d.ph) * 3; } }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.HEXDROP = { G: G, beans: function () { return beans; }, layers: function () { return layers; }, start: startMatch, update: update, inp: inp, save: save, tileAt: tileAt, xzToHex: xzToHex, hexToXZ: hexToXZ, P: function () { return P; } };
})();

</script>
